<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="tituloprincipal">
        primeiro formulario
        </h1>
    </header>
    <main class="principal">
        <form class="formulario">
            <h2 class="tituloformulario">
                login
            </h2>
            <div class="caixacampo">
                <label class="rotulocampo" for="nomecampo">
                    nome
                </label>
                <input type="text"
                 id="nomecampo"
                  class="campoformulario"
                    placeholder="digite seu nome"
                >
            </div>
            <div class="caixacampo">
                <label class="rotulocampo" for="emailçcampo">
                    email
                </label>
                <input type="text"
                 id="emailcampo"
                  class="campoformulario"
                    placeholder="digite seu email"
                >
            </div>
            <div class="caixacampo">
                <label class="rotulocampo" for="senhacampo">
                    senha
                </label>
                <input type="text"
                 id="senhacampo"
                  class="campoformulario"
                    placeholder="digite seu senha"
                >
            </div>

            <button class="btnEnviar">Enviar</button>
        </form>
    </main>
    
</body>
</html>
